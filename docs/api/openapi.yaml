openapi: 3.1.0
info:
  title: FlyttGo API
  version: "1"
  summary: Price quotes, moves on the company's invoice, and the company's jobs and appointments.
  description: |
    The REST API for companies on FlyttGo (docs/API.md). JSON over HTTPS, authenticated by the
    company's API key. A key is created by an owner or admin of an active company in the Corporate
    dashboard (API and widget), carries scopes, and acts as the member who created it: every request
    is checked as if that member did it in the dashboard (their company role, the company's terms
    and plan). It stops working when it is revoked or expires, while the company is not active, and
    when its creator is no longer an owner or admin.

    Errors are `{"error": {"code": "...", "message": "..."}}`. Each key has a limit of requests per
    minute (60 unless FlyttGo agrees another); every answer carries `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset` (seconds), and a refused request `Retry-After`.

    Writes accept an `Idempotency-Key` header: for 24 hours the same key and request return the
    first answer (with `Idempotent-Replayed: true`); the same key with another request is refused.

    The key is a server secret: the API sends no CORS headers, so browsers cannot call it from a
    web page. For a website use the booking widget instead (no key).
servers:
  - url: https://{project}.supabase.co/functions/v1/public-api
    description: FlyttGo's Supabase project (the project reference is in the dashboard's base URL)
    variables:
      project:
        default: your-project-ref
security:
  - apiKey: []
tags:
  - name: Key
  - name: Moves
    description: FlyttGo's moving and delivery (transport). Bookings are paid on the company's invoice.
  - name: Jobs
    description: The company's Jobs module (trades), when its plan includes it.
  - name: Appointments
    description: The company's Appointments module, when its plan includes it.

paths:
  /v1/me:
    get:
      tags: [Key]
      operationId: getKey
      summary: The key, its company, scopes and limit
      responses:
        "200":
          description: The key
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimit-Limit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimit-Remaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimit-Reset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/quotes:
    post:
      tags: [Moves]
      operationId: createQuote
      summary: Price a move
      description: |
        The price FlyttGo charges for the move, computed on the server with the formula the booking
        and payment functions use (the same as calculate-price): driving distance from the
        coordinates, van, hours (minimum 2), helpers and extras, MVA included. Nothing is booked.
      security:
        - apiKey: [quotes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "200":
          description: The quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
        "400": { $ref: "#/components/responses/InvalidJson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bookings:
    get:
      tags: [Moves]
      operationId: listBookings
      summary: The company's moves, newest first
      description: Every move booked for the company (in the dashboard or through the API). No driver data.
      security:
        - apiKey: ["bookings:read"]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Before"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BookingStatus" }
      responses:
        "200":
          description: A page of moves
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Moves]
      operationId: createBooking
      summary: Book a move on the company's invoice
      description: |
        Prices the move on the server (as POST /v1/quotes), books it for the company as the key's
        creator and pays it on the company's invoice, exactly as the dashboard's "Invoice" payment:
        FlyttGo must have switched invoice payment on for the company, and the booking must stay
        within its credit limit (and a current credit check where FlyttGo asks for one). The move then
        goes to dispatch. Refused bookings leave nothing behind.
      security:
        - apiKey: ["bookings:write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingRequest" }
      responses:
        "201":
          description: Booked and paid on invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "200":
          description: The answer to an earlier request with the same Idempotency-Key
          headers:
            Idempotent-Replayed:
              schema: { type: string, const: "true" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/InvalidJson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/bookings/{id}:
    get:
      tags: [Moves]
      operationId: getBooking
      summary: One of the company's moves
      security:
        - apiKey: ["bookings:read"]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The move
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs/services:
    get:
      tags: [Jobs]
      operationId: listJobServices
      summary: The company's active services
      security:
        - apiKey: [jobs]
      responses:
        "200":
          description: The services
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/JobService" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: The company's jobs, newest first
      security:
        - apiKey: [jobs]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Before"
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, quoted, accepted, declined, scheduled, in_progress, completed, invoiced, cancelled]
      responses:
        "200":
          description: A page of jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Job" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Record a job for a customer
      description: |
        As "New job" in the dashboard (create_job): a fixed or hourly service is agreed at its price;
        a service "on quote" waits for the company's quote. A service that needs an authorisation
        (for example electrical work) is refused until FlyttGo has it on record.
      security:
        - apiKey: [jobs]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRequest" }
      responses:
        "201":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "200":
          description: The answer to an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/InvalidJson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: One of the company's jobs
      security:
        - apiKey: [jobs]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/appointments/services:
    get:
      tags: [Appointments]
      operationId: listAppointmentServices
      summary: The company's services and who offers them
      security:
        - apiKey: [appointments]
      responses:
        "200":
          description: The services
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AppointmentService" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/appointments/slots:
    get:
      tags: [Appointments]
      operationId: listFreeSlots
      summary: Free times on a day
      description: The free times customers see on the company's page (available_slots), in Europe/Oslo.
      security:
        - apiKey: [appointments]
      parameters:
        - name: service_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: resource_id
          in: query
          description: Only this person or room
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The free times
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Slot" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: The company's appointments, latest start first
      security:
        - apiKey: [appointments]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: before
          in: query
          description: Only appointments starting before this time (the starts_at of the last item you have)
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { type: string, enum: [booked, cancelled, completed, no_show] }
      responses:
        "200":
          description: A page of appointments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/List"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Appointment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book a time for a customer
      description: |
        As the company booking in the dashboard (create_appointment): a free time with the person
        asked for, or with anyone free at that time. Never over another appointment; with a named
        person the company may book outside the opening hours, as in the dashboard.
      security:
        - apiKey: [appointments]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentRequest" }
      responses:
        "201":
          description: The appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "200":
          description: The answer to an earlier request with the same Idempotency-Key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/InvalidJson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/appointments/{id}:
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: One of the company's appointments
      security:
        - apiKey: [appointments]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "fgo_ followed by 64 hex characters"
      description: |
        The company's API key. Scopes: quotes, bookings:read, bookings:write (needs invoice payment
        switched on by FlyttGo), appointments and jobs (each needs the module in the company's plan).

  headers:
    RateLimit-Limit:
      description: Requests allowed per minute for this key
      schema: { type: integer }
    RateLimit-Remaining:
      description: Requests left in this minute
      schema: { type: integer }
    RateLimit-Reset:
      description: Seconds until the count starts again
      schema: { type: integer }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Before:
      name: before
      in: query
      description: Only items created before this time (the created_at of the last item you have)
      schema: { type: string, format: date-time }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 1 to 255 visible ASCII characters, unique per request you mean (for example your order number)
      schema: { type: string, minLength: 1, maxLength: 255 }

  responses:
    Unauthorized:
      description: No key, or a key that is not valid, revoked or expired (missing_key, invalid_key, key_revoked, key_expired)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The key may not do this now: scope_missing, scope_unavailable (not in the company's plan or
        terms now), organization_inactive, creator_not_member, or forbidden (the creator's company
        role does not allow it)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such record for this company (not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        Refused by the company's terms or the record's state (conflict): for example invoice payment
        not switched on, over the credit limit, the time just taken, a service needing an authorisation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request is not valid (invalid_request, with the fields), or idempotency_key_reused
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidJson:
      description: The body is not JSON (invalid_json)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests for this key in this minute (rate_limited)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [scope_missing] }
            message: { type: string }
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, examples: [pickup.lat] }
                  message: { type: string }

    List:
      type: object
      required: [object, data, has_more]
      properties:
        object: { const: list }
        data: { type: array }
        has_more: { type: boolean }

    Me:
      type: object
      properties:
        object: { const: api_key }
        id: { type: string, format: uuid }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        rate_limit_per_minute: { type: integer }
        acting_member: { type: string, format: uuid, description: The member the key acts as (its creator) }
        organization:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
            status: { type: string }

    Scope:
      type: string
      enum: [quotes, "bookings:read", "bookings:write", appointments, jobs]

    VanType:
      type: string
      enum: [small_van, medium_van, large_van, luton_van]

    Extra:
      type: string
      enum: [extra_helper, furniture_assembly, cleaning, parking_assistance, packing_service, furniture_dismantling]

    Coordinates:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    Place:
      allOf:
        - $ref: "#/components/schemas/Coordinates"
        - type: object
          required: [address]
          properties:
            address: { type: string, maxLength: 300 }
            postcode: { type: string, maxLength: 10 }
            city: { type: string, maxLength: 100 }

    Contact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, maxLength: 200 }
        phone: { type: string, maxLength: 40 }
        email: { type: string, format: email }

    QuoteRequest:
      type: object
      required: [pickup, dropoff, van_type]
      properties:
        pickup: { $ref: "#/components/schemas/Coordinates" }
        dropoff: { $ref: "#/components/schemas/Coordinates" }
        van_type: { $ref: "#/components/schemas/VanType" }
        helpers: { type: integer, minimum: 0, maximum: 6, default: 0 }
        estimated_hours: { type: number, minimum: 1, maximum: 24, default: 2, description: Charged at least 2 hours }
        additional_services:
          type: array
          items: { $ref: "#/components/schemas/Extra" }
      examples:
        - pickup: { lat: 59.9139, lng: 10.7522 }
          dropoff: { lat: 59.9500, lng: 10.8000 }
          van_type: medium_van
          helpers: 1
          estimated_hours: 3

    Quote:
      type: object
      properties:
        object: { const: quote }
        currency: { const: NOK }
        distance_km: { type: number }
        duration_minutes: { type: integer }
        routing_provider: { type: string, enum: [OSRM, haversine-fallback] }
        price_subtotal: { type: integer, description: Excluding MVA }
        vat_amount: { type: integer }
        price_total: { type: integer, description: Including 25 % MVA; what a booking is charged }
        breakdown:
          type: object
          properties:
            base_price: { type: integer }
            distance_charge: { type: integer }
            helpers_charge: { type: integer }
            extras_charge: { type: integer }

    BookingRequest:
      type: object
      required: [pickup, dropoff, van_type, move_date, contact]
      properties:
        pickup: { $ref: "#/components/schemas/Place" }
        dropoff: { $ref: "#/components/schemas/Place" }
        van_type: { $ref: "#/components/schemas/VanType" }
        helpers: { type: integer, minimum: 0, maximum: 6, default: 0 }
        estimated_hours: { type: number, minimum: 1, maximum: 24, default: 2 }
        additional_services:
          type: array
          items: { $ref: "#/components/schemas/Extra" }
        move_type: { type: string, maxLength: 40, default: office }
        move_date: { type: string, format: date, description: Today (Oslo) or later }
        move_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        contact: { $ref: "#/components/schemas/Contact" }
        notes: { type: string, maxLength: 2000, description: For the driver; also a place for your reference }

    BookingStatus:
      type: string
      enum: [pending, confirmed, driver_assigned, pickup_arrived, loading, in_transit, completed, cancelled]

    Booking:
      type: object
      description: What the company sees of a move; no driver data.
      properties:
        object: { const: booking }
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        payment_status: { type: string }
        payment_provider: { type: [string, "null"] }
        pickup_address: { type: [string, "null"] }
        pickup_postcode: { type: [string, "null"] }
        pickup_city: { type: [string, "null"] }
        dropoff_address: { type: [string, "null"] }
        dropoff_postcode: { type: [string, "null"] }
        dropoff_city: { type: [string, "null"] }
        move_type: { type: [string, "null"] }
        move_date: { type: [string, "null"], format: date-time }
        move_time: { type: [string, "null"] }
        van_type: { type: [string, "null"] }
        helpers: { type: [integer, "null"] }
        additional_services: { type: [array, "null"], items: { type: string } }
        estimated_hours: { type: [number, "null"] }
        distance_km: { type: [number, "null"] }
        price_estimate: { type: [number, "null"], description: NOK including MVA }
        customer_name: { type: [string, "null"] }
        customer_phone: { type: [string, "null"] }
        customer_email: { type: [string, "null"] }
        customer_notes: { type: [string, "null"] }
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        invoice_cycle: { type: string, enum: [per_booking, monthly], description: Only in the answer to POST /v1/bookings }
        replayed: { type: boolean, description: Present (true) when this is the answer to an earlier request }

    BookingList:
      allOf:
        - $ref: "#/components/schemas/List"
        - properties:
            data: { type: array, items: { $ref: "#/components/schemas/Booking" } }

    JobService:
      type: object
      properties:
        object: { const: job_service }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        price_type: { type: string, enum: [fixed, hourly, quote] }
        price: { type: [number, "null"], description: Including MVA }
        vat_rate: { type: number }
        call_out_fee: { type: [number, "null"] }
        requires_authorisation: { type: [string, "null"] }

    JobRequest:
      type: object
      required: [service_id, contact, place]
      properties:
        service_id: { type: string, format: uuid }
        contact: { $ref: "#/components/schemas/Contact" }
        place:
          type: object
          required: [address]
          properties:
            address: { type: string, maxLength: 300 }
            postcode: { type: string }
            city: { type: string }
            lat: { type: number }
            lng: { type: number }
        description: { type: string, maxLength: 4000 }
        preferred_time: { type: string, maxLength: 200 }

    Job:
      type: object
      properties:
        object: { const: job }
        id: { type: string, format: uuid }
        number: { type: integer }
        status: { type: string }
        service_id: { type: [string, "null"], format: uuid }
        customer: { $ref: "#/components/schemas/Contact" }
        address: { type: string }
        price_type: { type: string, enum: [fixed, hourly, quote] }
        agreed_price: { type: [number, "null"] }
        quote_amount: { type: [number, "null"] }
        window_start: { type: [string, "null"], format: date-time }
        window_end: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        replayed: { type: boolean }

    AppointmentService:
      type: object
      properties:
        object: { const: appointment_service }
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        duration_minutes: { type: integer }
        price: { type: number, description: Including MVA }
        vat_rate: { type: number }
        resources:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }

    Slot:
      type: object
      properties:
        resource_id: { type: string, format: uuid }
        resource_name: { type: string }
        starts_at: { type: string, format: date-time }

    AppointmentRequest:
      type: object
      required: [service_id, starts_at, contact]
      properties:
        service_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid, description: Leave out for anyone free at that time }
        starts_at: { type: string, format: date-time, description: With its offset, as returned by /v1/appointments/slots }
        contact: { $ref: "#/components/schemas/Contact" }
        notes: { type: string, maxLength: 2000 }

    Appointment:
      type: object
      properties:
        object: { const: appointment }
        id: { type: string, format: uuid }
        number: { type: integer }
        status: { type: string, enum: [booked, cancelled, completed, no_show] }
        service_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        customer: { $ref: "#/components/schemas/Contact" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        price: { type: number }
        created_at: { type: string, format: date-time }
        replayed: { type: boolean }
